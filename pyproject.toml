[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botainer-dashboard"
version = "0.1.0a1"
description = "A loopback terminal dashboard for selected Botainer installations and host agents"
readme = "README.md"
requires-python = ">=3.13.15,<3.14"
license = "Apache-2.0 AND MIT"
license-files = [
  "LICENSE",
  "third_party/README.md",
  "third_party/fastapi-swagger-ui-NOTICE.txt",
  "third_party/cpython-attribution.md",
  "third_party/python-LICENSE.txt",
  "third_party/optparse-LICENSE.txt",
  "third_party/idna-unicode-NOTICE.txt",
  "third_party/Unicode-LICENSE.txt",
  "third_party/pydantic-core-attribution.md",
  "third_party/pydantic-core-NOTICES.txt",
  "third_party/rust-stdlib-attribution.md",
  "third_party/rust-stdlib-NOTICES.txt",
  "frontend/vendor/xterm/LICENSE",
  "frontend/vendor/addon-fit/LICENSE",
  "frontend/vendor/addon-search/LICENSE",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "websockets==17.1",
  "pydantic==2.13.5",
]

[project.scripts]
botainer-dashboard = "botainer_dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "tools" = "tools"}
packages = ["botainer_dashboard"]
include-package-data = false

[tool.setuptools.package-data]
botainer_dashboard = ["_resources/**/*", "_resources/PACKAGE-MANIFEST.json"]

[tool.setuptools.cmdclass]
build_py = "tools.package_build.CheckedBuildPy"
