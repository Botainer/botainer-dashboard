name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-pty:
    name: Source and local integration (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      # These separate opt-in tests require a reviewed tmux installation.
      BOTAINER_DASHBOARD_TEST_TMUX: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          architecture: arm64
      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Prepare isolated test environment
        run: |
          python -I -B requirements/verify.py
          # Keep the selected executable inside the disposable environment.
          # A symlink resolves back into the runner's shared Python installation,
          # whose parent permissions may fail the real import-policy checks.
          python -m venv --copies "$RUNNER_TEMP/dashboard-ci"
          echo "$RUNNER_TEMP/dashboard-ci/bin" >> "$GITHUB_PATH"
      - name: Verify test interpreter permissions
        run: |
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          sys.path.insert(0, str(Path("src").resolve()))
          from botainer_dashboard.import_policy import ImportPolicyError, trusted_path

          executable = Path(sys.executable).resolve(strict=True)
          environment = (Path(os.environ["RUNNER_TEMP"]) / "dashboard-ci").resolve(strict=True)
          if not executable.is_relative_to(environment):
              raise SystemExit("CI Python resolves outside the disposable venv; recreate it with --copies.")
          try:
              trusted_path(executable)
          except ImportPolicyError as error:
              for path in (executable, *executable.parents):
                  info = path.stat()
                  print(f"{path}: uid={info.st_uid} mode={stat.S_IMODE(info.st_mode):04o}")
              raise SystemExit(f"CI interpreter permissions rejected: {error}. Fix runner provisioning; do not relax import policy.")
          print("PASS copied CI interpreter and parent permissions")
          PY
      - name: Install pinned binary dependencies on the runner
        run: |
          python -m pip --isolated install --disable-pip-version-check --no-input \
            --no-cache-dir --no-deps --only-binary=:all: --require-hashes \
            --index-url https://pypi.org/simple \
            -r requirements/dashboard-macos-arm64-py313.candidate.txt
      - name: Verify runtime and run checks
        run: |
          python --version
          node --version
          python -m pip --isolated check --disable-pip-version-check
          python -B - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path
          import sys

          packages = json.loads(Path("requirements/dashboard-macos-arm64-py313.metadata.json").read_text())["packages"]
          for package in packages:
              actual = importlib.metadata.version(package["name"])
              if actual != package["version"]:
                  raise SystemExit(f"Dependency mismatch: {package['name']} {actual}")
          # Fail before optional tests could skip a missing or broken runtime.
          import uvicorn
          import websockets.sync.client
          sys.path.insert(0, "src")
          from botainer_dashboard.service import create_app
          print(f"PASS runtime preflight: {len(packages)} pinned dependencies and service imports")
          PY
          python -B tools/check.py --pty
